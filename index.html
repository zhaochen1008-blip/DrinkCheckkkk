<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今儿您喝了吗？</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f8f9fa;padding:16px;color:#222}
.container{max-width:600px;margin:0 auto}
h1{text-align:center;margin:20px 0 30px;font-size:28px;color:#1f7549}
.card{background:#fff;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 4px 16px #00000015}
.btn{width:100%;padding:18px;border:none;border-radius:16px;background:#27ae60;color:#fff;font-size:20px;font-weight:bold;margin-top:12px}
.btn:active{opacity:0.85}
.record-item{padding:14px;border-bottom:1px solid #eee}
.record-item:last-child{border-bottom:none}

/* ========== 超大弹窗样式【疯一点，占满大部分屏幕】 ========== */
.modal-mask{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);
  display:none;align-items:center;justify-content:center;padding:12px;z-index:999
}
.modal-box{
  background:#fff;border-radius:24px;
  width:96%;height:88vh; /* 高度直接拉到屏幕88%，超大弹窗 */
  max-width:700px;
  padding:28px;
  display:flex;flex-direction:column;
  overflow:hidden
}
.modal-title{font-size:24px;font-weight:bold;margin-bottom:20px;text-align:center}
.modal-body{
  flex:1;overflow-y:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  padding:8px 0
}
.check-item{
  display:flex;align-items:center;gap:10px;font-size:20px;
  padding:14px;border:2px solid #e9e9e9;border-radius:14px
}
.check-item input{width:24px;height:24px}
.modal-footer{display:flex;gap:14px;margin-top:20px}
.modal-footer button{flex:1;padding:16px;border-radius:14px;border:none;font-size:19px;font-weight:bold}
.btn-cancel{background:#ddd;color:#222}
.btn-confirm{background:#27ae60;color:#fff}
</style>
</head>
<body>
<div class="container">
  <h1>🍻 今儿您喝了吗？</h1>
  <div class="card">
    <button class="btn" id="openModalBtn">添加今日饮酒记录</button>
  </div>
  <div class="card">
    <h2 style="margin-bottom:16px;font-size:22px">历史记录</h2>
    <div id="recordList"></div>
  </div>
</div>

<!-- 多选弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal-box">
    <div class="modal-title">选择今天喝的酒（可多选）</div>
    <div class="modal-body">
      <label class="check-item"><input type="checkbox" value="白酒"> 白酒</label>
      <label class="check-item"><input type="checkbox" value="红酒"> 红酒</label>
      <label class="check-item"><input type="checkbox" value="啤酒"> 啤酒</label>
      <label class="check-item"><input type="checkbox" value="黄酒"> 黄酒</label>
      <label class="check-item"><input type="checkbox" value="清酒"> 清酒</label>
      <label class="check-item"><input type="checkbox" value="洋酒"> 洋酒</label>
      <label class="check-item"><input type="checkbox" value="果酒"> 果酒</label>
      <label class="check-item"><input type="checkbox" value="其他"> 其他</label>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="modalCancel">取消</button>
      <button class="btn-confirm" id="modalConfirm">确认保存</button>
    </div>
  </div>
</div>

<script>
const modal = document.getElementById('modal');
const openModalBtn = document.getElementById('openModalBtn');
const modalCancel = document.getElementById('modalCancel');
const modalConfirm = document.getElementById('modalConfirm');
const recordList = document.getElementById('recordList');

// 读取本地存储
function getRecords(){
  const raw = localStorage.getItem('drinkRecords');
  return raw ? JSON.parse(raw) : [];
}
function saveRecords(list){
  localStorage.setItem('drinkRecords', JSON.stringify(list));
}
function renderList(){
  const arr = getRecords();
  recordList.innerHTML = '';
  if(arr.length === 0){
    recordList.innerHTML = '<div style="padding:10px;color:#777">暂无打卡记录</div>';
    return;
  }
  arr.reverse().forEach(item=>{
    const div = document.createElement('div');
    div.className='record-item';
    div.innerHTML = `<div style="font-weight:bold">${item.date}</div><div>饮品：${item.drinks.join('、')}</div>`;
    recordList.appendChild(div);
  })
}

// 打开弹窗
openModalBtn.onclick = ()=>{
  // 清空所有勾选
  document.querySelectorAll('.modal-body input').forEach(cb=>cb.checked=false);
  modal.style.display='flex';
}
//关闭弹窗
modalCancel.onclick = ()=> modal.style.display='none';
modal.querySelector('.modal-mask').onclick = e=>{
  if(e.target === modal) modal.style.display='none';
}

//确认保存
modalConfirm.onclick = ()=>{
  const selected = [];
  document.querySelectorAll('.modal-body input:checked').forEach(cb=>{
    selected.push(cb.value);
  })
  if(selected.length ===0){
    alert('至少选一项！');
    return;
  }
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
  const records = getRecords();
  records.push({date:dateStr, drinks:selected});
  saveRecords(records);
  renderList();
  modal.style.display='none';
  alert("✅ 打卡保存成功！");
}

renderList();
</script>
</body>
</html>
