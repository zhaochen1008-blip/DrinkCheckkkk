<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fdf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<title>喝了么</title>
<style>
  :root{
    --green:#46c98a; --green-bg:#e3f9ed; --green-text:#0e7a45;
    --red:#ff8a8a;   --red-bg:#ffecec;   --red-text:#b02a2a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{
    background:#fdf7f2;
    padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
  }
  .container{
    max-width:720px;
    margin:0 auto;
  }
  h1{
    text-align:center;
    font-size:22px;
    color:#333;
    margin-bottom:16px;
  }
  .stat-box{
    background:#fff;
    border-radius:20px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
  }
  .stat-item{
    text-align:center;
    padding:8px 0;
  }
  .stat-label{
    font-size:14px;color:#777;
  }
  .stat-num{
    font-size:26px;font-weight:bold;color:#333;
  }
  .btn-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin:16px 0 24px;
  }
  .btn-group>.btn{
    flex:1;
    min-width:102px;
    padding:14px 6px;
    font-size:16px;
    border:none;
    border-radius:20px;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .drink-btn{background-color:#ff4444;}
  .no-drink-btn{background-color:#28b968;}
  .del-btn{background-color:#777777;}

  .calendar-wrap{
    background:#fff;
    border-radius:20px;
    padding:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
  }
  .calendar-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .calendar-head button{
    border:none;background:#eee;border-radius:12px;padding:6px 12px;font-size:14px;
  }
  .week-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:8px;
    margin-bottom:10px;
  }
  .week-item{text-align:center;font-size:13px;color:#888;padding:6px 4px;}
  .day-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:10px;
    margin-bottom:10px;
  }
  .day-cell{
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;
    border-radius:12px;font-size:15px;
    border:1px solid #eee;
    cursor:pointer;
  }
  .day-cell.empty{border:none;cursor:default;}
  .day-cell.drink{background:var(--red-bg);color:var(--red-text);border-color:var(--red);}
  .day-cell.nodrink{background:var(--green-bg);color:var(--green-text);border-color:var(--green);}
  .day-cell.future{opacity:0.3;pointer-events:none;cursor:not-allowed;}
  .day-cell.today{box-shadow:0 0 0 2px #333;}
  .day-cell.selected{outline:2px solid #4285f4;}

  /* 多选弹窗 */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;
    padding:20px;z-index:99;
  }
  .modal{
    background:#fff;border-radius:24px;padding:24px;width:100%;max-width:420px;
  }
  .modal h3{margin-bottom:16px;text-align:center;}
  .check-list{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;
  }
  .check-item{
    display:flex;align-items:center;gap:6px;font-size:16px;
  }
  .modal-btns{
    display:flex;gap:10px;
  }
  .modal-btns button{
    flex:1;padding:12px;border:none;border-radius:14px;font-size:16px;
  }
  .confirm{background:#28b968;color:#fff;}
  .cancel{background:#eee;color:#333;}
</style>
</head>
<body>
<div class="container">
  <h1>喝了么</h1>
  <div class="stat-box">
    <div class="stat-item">
      <div class="stat-label">当前连续记录</div>
      <div class="stat-num" id="continueText">加载中</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">历史最高戒断</div>
      <div class="stat-num" id="maxClean">0 天</div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn drink-btn" id="btnDrink">
      <span>🍻</span>
      <span>又整一口</span>
    </button>
    <button class="btn no-drink-btn" id="btnNoDrink">
      <span>✅</span>
      <span>顶住诱惑</span>
    </button>
    <button class="btn del-btn" id="btnDel">
      <span>🗑️</span>
      <span>抹除罪证</span>
    </button>
  </div>

  <div class="calendar-wrap">
    <div class="calendar-head">
      <button id="prevMonth">←上月</button>
      <div id="monthTitle"></div>
      <button id="nextMonth">下月→</button>
    </div>
    <div class="week-row">
      <div class="week-item">日</div>
      <div class="week-item">一</div>
      <div class="week-item">二</div>
      <div class="week-item">三</div>
      <div class="week-item">四</div>
      <div class="week-item">五</div>
      <div class="week-item">六</div>
    </div>
    <div id="calendarBody"></div>
  </div>
</div>

<!-- 酒品多选弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3>今天整了啥？</h3>
    <div class="check-list">
      <label class="check-item"><input type="checkbox" value="白酒">白酒</label>
      <label class="check-item"><input type="checkbox" value="啤酒">啤酒</label>
      <label class="check-item"><input type="checkbox" value="红酒">红酒</label>
      <label class="check-item"><input type="checkbox" value="洋酒">洋酒</label>
    </div>
    <div class="modal-btns">
      <button class="cancel" id="modalCancel">取消</button>
      <button class="confirm" id="modalOk">确认打卡</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "drink_record_v1";
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
let currentYM = new Date();
let selectedDate = "";

// 阴阳文案池
const noDrinkWords = [
  "不喝不难受吗？",
  "哟，今天忍住了？",
  "别人都在喝，你搁这自律呢？",
  "真能扛啊，一点不动心？",
  "今日装清醒任务完成✅",
  "克制这一下，是为下次更好开喝",
  "忍一时，酒局还在后头"
];
const drinkWords = [
  "每天在不喝和少喝之间，选择不少喝",
  "道理都懂，酒还是要喝的",
  "说好浅酌，怎么又上手了",
  "抵抗失败，投降给酒精",
  "没事，就喝一点点（骗谁呢）",
  "自控力下线，酒精上线",
  "计划戒酒，计划失败"
];
function getRandom(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}

// 统计
function calcStat(){
  const days = Object.keys(records).sort();
  let maxClean = 0;
  let nowClean = 0;
  let nowDrink = 0;
  let cleanRun = 0;
  for(let d of days){
    if(records[d].type === "nodrink"){
      cleanRun++;
      nowClean = cleanRun;
      maxClean = Math.max(maxClean, cleanRun);
      nowDrink = 0;
    }else{
      cleanRun = 0;
      nowDrink++;
      nowClean = 0;
    }
  }
  if(nowClean>0){
    document.getElementById("continueText").innerText = `已顶住诱惑 ${nowClean} 天`;
  }else if(nowDrink>0){
    document.getElementById("continueText").innerText = `又整一口 ${nowDrink} 天`;
  }else{
    document.getElementById("continueText").innerText = "暂无记录";
  }
  document.getElementById("maxClean").innerText = maxClean + " 天";
}

// 渲染日历
function renderCalendar(){
  const y = currentYM.getFullYear();
  const m = currentYM.getMonth();
  document.getElementById("monthTitle").innerText = `${y}年${m+1}月`;
  const body = document.getElementById("calendarBody");
  body.innerHTML = "";
  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);
  const today = new Date();
  const todayY = today.getFullYear();
  const todayM = today.getMonth();
  const todayStr = getTodayStr();
  const firstWeek = first.getDay();

  let html = "";
  let row = `<div class="day-row">`;
  for(let i=0;i<firstWeek;i++) row += `<div class="day-cell empty"></div>`;
  for(let d=1;d<=last.getDate();d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isFuture = new Date(ds) > today;
    let cls = "day-cell";
    if(isFuture) cls += " future";
    if(ds === todayStr) cls += " today";
    if(ds === selectedDate) cls += " selected";
    if(records[ds]){
      cls += " " + records[ds].type;
    }
    row += `<div class="${cls}" data-date="${ds}">${d}</div>`;
    if((firstWeek + d) %7 ===0){
      row += `</div>`;
      html += row;
      row = `<div class="day-row">`;
    }
  }
  if(row !== `<div class="day-row">`) html += row + `</div>`;
  body.innerHTML = html;

  // 日期点击绑定
  document.querySelectorAll(".day-cell:not(.empty):not(.future)").forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll(".day-cell").forEach(cel=>cel.classList.remove("selected"))
      el.classList.add("selected");
      selectedDate = el.dataset.date;
    })
  })
  calcStat();
}

// 保存函数
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}
function getTodayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 绑定按钮事件
document.getElementById("btnDrink").addEventListener('click', ()=>{
  if(!selectedDate) selectedDate = getTodayStr();
  document.getElementById("mask").style.display="flex";
  document.querySelectorAll(".check-list input").forEach(cb=>cb.checked=false);
})
document.getElementById("btnNoDrink").addEventListener('click', ()=>{
  if(!selectedDate) selectedDate = getTodayStr();
  records[selectedDate] = {type:"nodrink",wine:[]};
  save();
  renderCalendar();
  alert(getRandom(noDrinkWords));
})
document.getElementById("btnDel").addEventListener('click', ()=>{
  if(!selectedDate) {
    alert("先点日历选中一天！");
    return;
  }
  if(!confirm(`确定抹除【${selectedDate}】的罪证吗？`)) return;
  delete records[selectedDate];
  selectedDate = "";
  save();
  renderCalendar();
})

document.getElementById("modalCancel").addEventListener('click', ()=>{
  document.getElementById("mask").style.display="none";
})
document.getElementById("modalOk").addEventListener('click', ()=>{
  const arr = [];
  document.querySelectorAll(".check-list input:checked").forEach(cb=>arr.push(cb.value));
  if(arr.length === 0) {
    alert("至少选一个酒品");
    return;
  }
  records[selectedDate] = {type:"drink",wine:arr};
  save();
  document.getElementById("mask").style.display="none";
  renderCalendar();
  alert(getRandom(drinkWords));
})

document.getElementById("prevMonth").addEventListener('click', ()=>{
  currentYM.setMonth(currentYM.getMonth()-1);
  renderCalendar();
})

document.getElementById("nextMonth").addEventListener('click', ()=>{
  const now = new Date();
  const cy = currentYM.getFullYear();
  const cm = currentYM.getMonth();
  // 如果当前展示年月已经等于真实年月，禁止向后
  if (cy === now.getFullYear() && cm === now.getMonth()) {
    return;
  }
  currentYM.setMonth(currentYM.getMonth() + 1);
  renderCalendar();
})

// 初始化
renderCalendar();
</script>
</body>
</html>
